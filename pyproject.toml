[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-mcp-jayfraggs"
version = "0.1.0"
description = "MCP server for Obsidian vaults — Dataview, Tasks, Templater, Excalidraw, Omnisearch"
readme = "src/obsidian_mcp/README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["obsidian", "mcp", "knowledge-management", "claude", "llm"]

dependencies = [
    "mcp>=1.0,<2",
    "fastmcp>=0.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "watchdog>=4.0",
    "rapidfuzz>=3.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
obsidian-mcp     = "obsidian_mcp.__main__:_cli"
obsidian-mcp-web = "obsidian_mcp._web_entry:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
